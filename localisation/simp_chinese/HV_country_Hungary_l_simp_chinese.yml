 XYL_ethnic_conflict: "民族冲突"
 XYL_ethnic_conflict_desc: "斯洛伐克、达契亚和塞尔维亚等少数民族对马扎尔身份认同并不强烈，政府强行推广大马扎尔概念进一步激化了各民族间的矛盾。"
 XYL_backward_industry: "落后的工业"
 XYL_backward_industry_desc: "匈牙利的工业基础薄弱，无法满足国家的需求。"
 XYL_agricultural_tradition: "农业传统"
 XYL_agricultural_tradition_desc: "传统农业使用着匈牙利的大部分土地，农业产出占国内生产总值的很大一部分。"
 XYL_old_style_army: "旧式军队"
 XYL_old_style_army_desc: "匈牙利的军队仍保持着传统的组织和训练方式，缺乏现代化的装备和战术。"
 XYL_army_reform: "军队改革"
 XYL_army_reform_desc: "匈牙利的军队正在进行现代化改革，以提高其战斗力和效率。"
 XYL_political_dilemma: "政治困境"
 XYL_political_dilemma_desc: "匈牙利面临复杂的内部政治问题，需要在不同利益集团之间寻求平衡。"
