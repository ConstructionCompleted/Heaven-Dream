 democratic_socialism_subtype: "民主社会主义"
 democratic_socialism_subtype_desc: "§g§Y$democratic_socialism_subtype$§!\n\n民主社会主义涵盖了认为社会主义和民主不仅可以实现，并且二者相因相生的人士。社会主义和民主浑然一体，如同歌词之于歌曲、韵律之于诗歌一般无法分离。因此，民主社会主义者高度重视工作场所和政府中的民主，在生产活动管理中必须要有工人的参与。\n\n通常，民主社会主义者主张去中心化经济或市场社会主义经济，混有国有企业、小型私营工人合作社和工团等成分。民主社会主义本质上是典型的改良马克思主义，尽管革命者并非从未使用过这一术语。\n\n这种社会主义变体最初由19世纪和20世纪早期欧洲的社会民主党提倡，其主要支持者包括工会、工人和中上层中产阶级知识分子。尽管社会民主主义逐渐转向福利资本主义的形式，但民主社会主义者仍然坚持建立一个以人权和民主选举为基础的社会主义国家。§!"
