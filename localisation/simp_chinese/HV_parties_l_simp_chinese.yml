 national_monarchy_subtype_desc: "§g§Y$national_monarchy_subtype$§!\n\n民族君主制是一种以​​共同民族认同​​为纽带、以​​王权集中化​​为特征的政治形态。其本质是通过强化民族共同体意识，将分散的封建地方政权和军阀势力整合为中央集权的军事-行政机器，同时与新兴经济集团（如商人、手工业者）结盟，形成对抗传统保守派势力的统治基础。§!"
