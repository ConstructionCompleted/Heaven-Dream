 binary_constitutional_monarchy_subtype: "二元制君主立宪制"
 binary_constitutional_monarchy_subtype_desc: "§g§Y$au_binary_constitutional_monarchy_subtype$§!\n\n随着绝对君主制在全世界失势、被宪政取而代之，另一种不同的选择也随之显现。虽然在大多数君主立宪制国家，权力被授予官员、国家行政和立法机关，但在施行二元制君主立宪的国家，情况并非如此。\n\n在这种制度中，对君主权力的约束很少，而且在实践中往往流于形式，这就使得君主拥有巨大的权力，无论是行政还是立法都能以个人意志加以干涉。二元制君主立宪制往往由君主推动建立，他们希望在改善自身形象的同时不放弃现有的权力。虽说不像绝对君主制那般不受约束，但归根到底君主仍旧难以撼动，国家仍处在君主的支配下。§!"
 parliamentary_constitutional_monarchy_subtype: "议会制君主立宪制"
 parliamentary_constitutional_monarchy_subtype_desc: "§g§Y$parliamentary_constitutional_monarchy_subtype$§!\n\n   §!"
 warlordism_subtype: "军阀"
 warlordism_subtype_desc: "§g§Y$warlordism_subtype$§!\n\n人们在谈及权力时，一般认为这个词是指对其他人思想与行动的控制。在一般的国家中，这种控制往往是通过政治渠道实现的：领导人通过命令、威胁与劝诱来实现自己的统治，暴力机构只会被用于应付特别情况。\n\n而在军阀看来，他们没有兴趣也没有能力通过这种间接的手段处理问题。军阀是武装势力的领导人，他们通常直接使用暴力行使权力。军阀会恐吓当地人民、掠夺资源，同时消灭任何敢于反对的人。生活在军阀治下的人可以说相当不幸，他们要面对的往往是劫掠成性的军队与不能用常理约束的军头。虽然个别军阀会有长远的计划与目标，但是他们手下臃肿的军队需要依靠烧杀抢掠才能维持，所以军阀永远会选择牺牲他人的利益来满足自己。§!"
 totalism_subtype: "$totalism$"
 totalism_subtype_desc: "§g§Y$totalism_subtype$§!\n\n   §!"
 national_communism_subtype: "民族共产主义"
 national_communism_subtype_desc: "§g§Y$national_communism_subtype$§!\n\n   §!"
 red_junta_subtype: "红色军政府"
 red_junta_subtype_desc: "§g§Y$red_junta_subtype$§!\n\n带有左翼倾向的军政府同非红色的军政府一样，形式多种多样，它们的共同点是利用军队来“保卫”自己扎根之国家的社会主义。在红色军政府中，将军和士兵取代了政委和书记，他们会通过深度专制的警察国度以及一次又一次的武装行动来消灭那些以革命谋私利的腐败文官和颠覆分子。目的达成后，军政府可能会逐渐褪去身上的军事色彩，也可能会永久巩固住自己的统治。红色军政府虽带有强烈的军事威权印记，但在铁血镇压之外也存在着社会主义的治理，其在上台前向人民许下的福利和人身保护也基本都能够兑现。§!"
